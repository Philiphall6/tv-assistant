name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa
        with:
          category: integration

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: home-assistant/actions/hassfest@86d4564712fa02543c808e3a693dd04f9d3f8361

  tests:
    name: Integration and browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python scripts/check-public-tree.py
      - run: python scripts/generate-localization.py --check
      - run: python tests/test_localization_catalog.py
      - run: python tests/test_docs.py
      - run: python tests/test_brand_assets.py
      - run: sha256sum -c libs/SHA256SUMS
      - run: pip install PyYAML playwright
      - run: python tests/test_ha_panel.py
      - run: playwright install --with-deps chromium
      - run: python tests/test_brand_browser.py
      - run: python tests/test_connections_browser.py
      - run: python tests/test_panel_browser.py
      - run: python tests/test_cards_browser.py
      - run: python tests/test_localization_browser.py
      - run: docker run --rm --network none -v "$PWD:/work" -w /work ghcr.io/home-assistant/home-assistant:2026.10.4 python tests/ha_component_runtime.py
