name: Android

on:
  push:
    paths: ['app/**', 'libs/**', 'tests/**', 'scripts/**', 'localization/**', 'build-apk.sh', '.github/workflows/android.yml']
  pull_request:
    paths: ['app/**', 'libs/**', 'tests/**', 'scripts/**', 'localization/**', 'build-apk.sh', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  instrumentation:
    name: Android API ${{ matrix.api }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        api: [30, 36]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.1.0'
      - name: Enable emulator acceleration
        run: sudo chmod a+rw /dev/kvm
      - uses: ReactiveCircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: ANDROID_SERIAL=emulator-5554 tests/run-android.sh
