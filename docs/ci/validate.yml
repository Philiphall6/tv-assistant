# Copy to .github/workflows/validate.yml only with authorized workflow-write access.
name: Validate
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python scripts/check-public-tree.py
      - run: sha256sum -c libs/SHA256SUMS
      - run: pip install PyYAML playwright
      - run: python tests/test_ha_panel.py
      - run: playwright install --with-deps chromium
      - run: python tests/test_panel_browser.py && python tests/test_cards_browser.py
      - run: docker run --rm --network none -v "$PWD:/work" -w /work ghcr.io/home-assistant/home-assistant:2026.10.4 python tests/ha_component_runtime.py
      - run: docker run --rm --network none -v "$PWD:/github/workspace" ghcr.io/home-assistant/hassfest@sha256:d4a30239f4afd2ce01f7713aa922743b822d5641e471fd1835144f020479b0d5
  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: HACS validation (pinned image)
        env:
          INPUT_GITHUB_TOKEN: ${{ github.token }}
        run: >-
          docker run --rm -e INPUT_GITHUB_TOKEN -e GITHUB_REPOSITORY
          -e INPUT_CATEGORY=integration -e INPUT_COMMENT=false
          -e GITHUB_WORKSPACE=/github/workspace -e GITHUB_EVENT_PATH=/event.json
          -v "$PWD:/github/workspace:ro" -v "$GITHUB_EVENT_PATH:/event.json:ro"
          ghcr.io/hacs/action@sha256:187499a09c5d41f9f0d42ff80d203ed87b974c028290140913b61e005fb0aab2
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        api: [30, 36]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.1.0'
      - name: Enable emulator acceleration
        run: sudo chmod a+rw /dev/kvm
      - uses: ReactiveCircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: ANDROID_SERIAL=emulator-5554 tests/run-android.sh
